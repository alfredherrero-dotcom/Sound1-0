<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets de gastos</title>
  <style>
    :root {
      --fondo: #f4f6f8; --tarjeta: #fff; --texto: #1f2933; --suave: #616e7c;
      --borde: #d9e2ec; --primario: #1a73e8; --primario-osc: #1557b0;
      --ok: #188038; --error: #c5221f; --aviso: #fef7e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #111418; --tarjeta: #1c2127; --texto: #e4e7eb; --suave: #9aa5b1;
        --borde: #323f4b; --primario: #8ab4f8; --primario-osc: #aecbfa;
        --ok: #81c995; --error: #f28b82; --aviso: #3a3320;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fondo); color: var(--texto);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.35rem; margin: 4px 0 16px; }
    .tarjeta {
      background: var(--tarjeta); border: 1px solid var(--borde);
      border-radius: 14px; padding: 16px; margin-bottom: 16px;
    }
    .oculto { display: none !important; }
    .boton {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 12px;
      border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto);
      font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .boton + .boton { margin-top: 10px; }
    .boton.primario { background: var(--primario); border-color: var(--primario); color: #fff; }
    @media (prefers-color-scheme: dark) { .boton.primario { color: #0b1a2e; } }
    .boton.grande { min-height: 76px; font-size: 1.15rem; }
    .boton:disabled { opacity: .6; cursor: default; }
    input[type=file] { display: none; }
    .vista { width: 100%; max-height: 260px; object-fit: contain; border-radius: 10px;
      background: var(--fondo); display: block; margin-bottom: 14px; }
    label.campo { display: block; font-size: .85rem; color: var(--suave); margin: 12px 0 4px; }
    .campo input {
      display: block; width: 100%; margin-top: 4px; min-height: 46px; padding: 10px 12px;
      font: inherit; color: var(--texto); background: var(--tarjeta);
      border: 1px solid var(--borde); border-radius: 10px;
    }
    .campo input:focus { outline: 2px solid var(--primario); outline-offset: 1px; }
    .campo input.revisar { background: var(--aviso); }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .nota { font-size: .85rem; color: var(--suave); margin: 10px 0 0; }
    .estado { display: flex; align-items: center; gap: 10px; color: var(--suave); margin: 4px 0 10px; }
    .girando { width: 20px; height: 20px; border: 3px solid var(--borde);
      border-top-color: var(--primario); border-radius: 50%; animation: g 0.8s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }
    .exito { color: var(--ok); font-weight: 700; font-size: 1.1rem; margin: 0 0 10px; }
    .error { color: var(--error); margin: 10px 0 0; }
    .lista { list-style: none; padding: 0; margin: 0; }
    .lista li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0;
      border-top: 1px solid var(--borde); }
    .lista li:first-child { border-top: 0; }
    .lista .nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lista .nombre small { display: block; color: var(--suave); }
    .lista .importe { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    a { color: var(--primario); }
    .enlaces { display: flex; gap: 16px; flex-wrap: wrap; font-size: .95rem; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
  </style>
</head>
<body>
<main>
  <h1>🧾 Tickets de gastos</h1>

  <!-- Paso 1: capturar -->
  <section id="paso-captura" class="tarjeta">
    <label class="boton primario grande" for="foto-camara">📷 Hacer foto del ticket</label>
    <label class="boton" for="foto-galeria">🖼️ Elegir de la galería</label>
    <input id="foto-camara" type="file" accept="image/*" capture="environment">
    <input id="foto-galeria" type="file" accept="image/*">
    <p class="nota">Haz la foto con buena luz, con el ticket entero y recto.</p>
  </section>

  <!-- Paso 2: revisar y guardar -->
  <section id="paso-revision" class="tarjeta oculto">
    <img id="vista" class="vista" alt="Foto del ticket">
    <div id="leyendo" class="estado"><div class="girando"></div> Leyendo el ticket…</div>
    <form id="formulario" class="oculto" autocomplete="off">
      <div class="fila">
        <label class="campo">Fecha<input id="fecha" type="date" required></label>
        <label class="campo">Hora<input id="hora" type="time" required></label>
      </div>
      <label class="campo">Comercio<input id="comercio" type="text" required maxlength="80" placeholder="Nombre del comercio"></label>
      <label class="campo">Importe (€)<input id="importe" type="text" inputmode="decimal" required placeholder="0,00"></label>
      <p id="aviso-revisar" class="nota oculto">Revisa los campos marcados: no se han podido leer bien.</p>
      <p id="error" class="error oculto"></p>
      <div style="margin-top:16px">
        <button id="guardar" class="boton primario" type="submit">💾 Guardar ticket</button>
        <button id="cancelar" class="boton" type="button">Cancelar</button>
      </div>
    </form>
  </section>

  <!-- Paso 3: hecho -->
  <section id="paso-hecho" class="tarjeta oculto">
    <p class="exito">✓ Ticket guardado</p>
    <p id="hecho-nombre" class="nota" style="margin-top:0"></p>
    <a id="hecho-pdf" class="boton" target="_blank" rel="noopener">Ver PDF</a>
    <button id="otro" class="boton primario" type="button">📷 Otro ticket</button>
  </section>

  <!-- Resumen -->
  <section id="resumen" class="tarjeta oculto">
    <h2>Últimos tickets</h2>
    <ul id="ultimos" class="lista"></ul>
    <p id="sin-tickets" class="nota oculto">Todavía no hay tickets guardados.</p>
    <div class="enlaces" style="margin-top:12px">
      <a id="enlace-hoja" target="_blank" rel="noopener">📊 Hoja de cálculo</a>
      <a id="enlace-carpeta" target="_blank" rel="noopener">📁 Carpeta en Drive</a>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let imagenActual = null; // { base64, mimeType }

  function llamar(funcion, ...args) {
    return new Promise((ok, ko) => {
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[funcion](...args);
    });
  }

  function mostrarPaso(paso) {
    ['paso-captura', 'paso-revision', 'paso-hecho'].forEach((id) =>
      $(id).classList.toggle('oculto', id !== paso));
    window.scrollTo(0, 0);
  }

  /** Reduce la foto (máx. 2000 px) y la convierte a JPEG para que suba rápido. */
  function prepararImagen(archivo, maxLado = 2000, calidad = 0.85) {
    return new Promise((ok, ko) => {
      const url = URL.createObjectURL(archivo);
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * escala);
        canvas.height = Math.round(img.naturalHeight * escala);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        ok(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('No se ha podido abrir la imagen.')); };
      img.src = url;
    });
  }

  function mostrarError(e) {
    const msg = (e && e.message) ? e.message : String(e);
    $('error').textContent = '⚠️ ' + msg.replace(/^Exception:\s*/, '');
    $('error').classList.remove('oculto');
  }

  function formatoEuros(n) {
    return Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  }

  async function alElegirFoto(ev) {
    const archivo = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!archivo) return;

    $('formulario').reset();
    $('formulario').classList.add('oculto');
    $('error').classList.add('oculto');
    $('aviso-revisar').classList.add('oculto');
    $('leyendo').classList.remove('oculto');
    document.querySelectorAll('.revisar').forEach((el) => el.classList.remove('revisar'));
    mostrarPaso('paso-revision');

    try {
      const dataUrl = await prepararImagen(archivo);
      $('vista').src = dataUrl;
      imagenActual = { base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' };

      let datos;
      try {
        datos = await llamar('analizarTicket', imagenActual.base64, imagenActual.mimeType);
      } catch (e) {
        // Si falla la lectura automática, se rellena a mano.
        const ahora = new Date();
        const p = (n) => String(n).padStart(2, '0');
        datos = {
          fecha: `${ahora.getFullYear()}-${p(ahora.getMonth() + 1)}-${p(ahora.getDate())}`,
          hora: `${p(ahora.getHours())}:${p(ahora.getMinutes())}`,
          comercio: '', importe: '',
          detectado: { fecha: false, hora: false, comercio: false, importe: false },
        };
      }

      $('fecha').value = datos.fecha;
      $('hora').value = datos.hora;
      $('comercio').value = datos.comercio;
      $('importe').value = datos.importe === '' ? '' : Number(datos.importe).toFixed(2).replace('.', ',');

      let hayQueRevisar = false;
      ['fecha', 'hora', 'comercio', 'importe'].forEach((campo) => {
        if (!datos.detectado[campo]) { $(campo).classList.add('revisar'); hayQueRevisar = true; }
      });
      $('aviso-revisar').classList.toggle('oculto', !hayQueRevisar);
    } catch (e) {
      mostrarError(e);
    } finally {
      $('leyendo').classList.add('oculto');
      $('formulario').classList.remove('oculto');
    }
  }

  async function alGuardar(ev) {
    ev.preventDefault();
    $('error').classList.add('oculto');
    if (!imagenActual) { mostrarError('Falta la foto del ticket.'); return; }

    const importe = $('importe').value.trim();
    if (!/^\d{1,3}([.\s]?\d{3})*([.,]\d{1,2})?$/.test(importe)) {
      mostrarError('Escribe el importe como 12,50');
      $('importe').focus();
      return;
    }

    const boton = $('guardar');
    boton.disabled = true;
    boton.textContent = 'Guardando…';
    try {
      const r = await llamar('guardarTicket', {
        imagenBase64: imagenActual.base64,
        mimeType: imagenActual.mimeType,
        fecha: $('fecha').value,
        hora: $('hora').value.slice(0, 5),
        comercio: $('comercio').value.trim(),
        importe: importe,
      });
      imagenActual = null;
      $('hecho-nombre').textContent = r.nombre;
      $('hecho-pdf').href = r.pdfUrl;
      mostrarPaso('paso-hecho');
      cargarResumen();
    } catch (e) {
      mostrarError(e);
    } finally {
      boton.disabled = false;
      boton.textContent = '💾 Guardar ticket';
    }
  }

  async function cargarResumen() {
    try {
      const r = await llamar('obtenerResumen');
      $('enlace-hoja').href = r.hojaUrl;
      $('enlace-carpeta').href = r.carpetaUrl;
      const ul = $('ultimos');
      ul.innerHTML = '';
      r.ultimos.forEach((t) => {
        const li = document.createElement('li');
        const nombre = document.createElement('div');
        nombre.className = 'nombre';
        const enlace = document.createElement(t.url ? 'a' : 'span');
        enlace.textContent = t.comercio;
        if (t.url) { enlace.href = t.url; enlace.target = '_blank'; enlace.rel = 'noopener'; }
        const sub = document.createElement('small');
        sub.textContent = `${t.fecha} · ${t.hora}`;
        nombre.append(enlace, sub);
        const imp = document.createElement('div');
        imp.className = 'importe';
        imp.textContent = formatoEuros(t.importe);
        li.append(nombre, imp);
        ul.appendChild(li);
      });
      $('sin-tickets').classList.toggle('oculto', r.ultimos.length > 0);
      $('resumen').classList.remove('oculto');
    } catch (e) {
      console.error(e);
    }
  }

  $('foto-camara').addEventListener('change', alElegirFoto);
  $('foto-galeria').addEventListener('change', alElegirFoto);
  $('formulario').addEventListener('submit', alGuardar);
  $('cancelar').addEventListener('click', () => { imagenActual = null; mostrarPaso('paso-captura'); });
  $('otro').addEventListener('click', () => mostrarPaso('paso-captura'));
  cargarResumen();
</script>
</body>
</html>
